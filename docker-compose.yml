services:
  mysql:
    image: mysql:8.4
    container_name: haven-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: haven
      MYSQL_DATABASE: haven
      MYSQL_USER: haven
      MYSQL_PASSWORD: haven
    ports:
      - '3307:3306'
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - haven-mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uhaven', '-phaven']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  haven-mysql-data:
