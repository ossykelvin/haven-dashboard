# Runs Haven's lint, tests, typecheck, and production build.
name: verify

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same branch cancels the older in-flight run.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the branch
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # `npm ci` installs exactly the committed lockfile. Never `npm install`
      # in CI: it can silently resolve different versions than the developer had.
      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Assemble cPanel package
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          mkdir -p release/haven-cpanel/docs
          cp -R .next prisma release/haven-cpanel/
          if [ -d public ]; then cp -R public release/haven-cpanel/; fi
          cp package.json package-lock.json next.config.ts server.js .env.example release/haven-cpanel/
          cp docs/DEPLOYMENT.md release/haven-cpanel/docs/

      - name: Upload cPanel package
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: haven-cpanel-${{ github.sha }}
          path: release/haven-cpanel
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
