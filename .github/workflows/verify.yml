# Runs Haven's lint, tests, typecheck, and production build.
name: verify

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same branch cancels the older in-flight run.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the branch
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # `npm ci` installs exactly the committed lockfile. Never `npm install`
      # in CI: it can silently resolve different versions than the developer had.
      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Assemble cPanel package
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          mkdir -p release/haven-cpanel/docs
          rm -rf .next/cache
          cp -R .next prisma release/haven-cpanel/
          if [ -d public ]; then cp -R public release/haven-cpanel/; fi
          cp package.json package-lock.json next.config.mjs server.js .env.example .gitignore .cpanel.yml release/haven-cpanel/
          cp docs/DEPLOYMENT.md release/haven-cpanel/docs/

      # `next build` emits .next/node_modules/<scope>/<pkg>-<hash> as symlinks holding this
      # runner's ABSOLUTE path (e.g. /home/runner/work/...). Those links are meaningless on the
      # deployment host, and Turbopack's chunks require them by that hashed name — so without
      # this step the server fails with "Cannot find module '@prisma/client-<hash>'".
      # Record each link as a relocatable command and drop the dead links from the package.
      - name: Record build-emitted module links
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          script=release/haven-cpanel/relink-externals.sh
          {
            echo '#!/bin/sh'
            echo '# Generated by .github/workflows/verify.yml. Do not edit by hand.'
            echo '# Recreates the module links `next build` emitted, rooted at the application root.'
            echo 'set -eu'
            echo 'APPROOT="${1:-$(pwd)}"'
          } > "$script"

          links_file="$(mktemp)"
          if [ -d .next/node_modules ]; then
            find .next/node_modules -type l > "$links_file"
          fi

          links=0
          while IFS= read -r link; do
            [ -n "$link" ] || continue
            target=$(readlink "$link")
            case "$target" in
              */node_modules/*) package=${target##*/node_modules/} ;;
              *) echo "::error::Unexpected link target: $link -> $target" >&2; exit 1 ;;
            esac
            {
              echo "mkdir -p \"\$APPROOT/$(dirname "$link")\""
              echo "ln -sfn \"\$APPROOT/node_modules/$package\" \"\$APPROOT/$link\""
            } >> "$script"
            links=$((links + 1))
          done < "$links_file"

          # The copied links still hold this runner's absolute paths and cannot work elsewhere.
          if [ -d release/haven-cpanel/.next/node_modules ]; then
            find release/haven-cpanel/.next/node_modules -type l -delete
          fi

          chmod +x "$script"
          echo "Recorded $links build-emitted module link(s):"
          cat "$script"

          # A build that emits none means Next changed how it externalises packages; the deploy
          # step would then silently stop relinking anything.
          if [ "$links" -eq 0 ]; then
            echo "::error::next build emitted no module links - relink-externals.sh would be a no-op. Check whether Next still emits .next/node_modules." >&2
            exit 1
          fi

      - name: Upload cPanel package
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: haven-cpanel-${{ github.sha }}
          path: release/haven-cpanel
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  publish-cpanel-branch:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download verified cPanel package
        uses: actions/download-artifact@v8
        with:
          name: haven-cpanel-${{ github.sha }}
          path: cpanel-package

      - name: Publish prebuilt cPanel branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git clone --branch cpanel-release "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" cpanel-release
          cd cpanel-release
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -r --ignore-unmatch .
          cp -a ../cpanel-package/. .
          git add --force .
          git commit -m "Build cPanel release for $GITHUB_SHA"
          git push origin cpanel-release
